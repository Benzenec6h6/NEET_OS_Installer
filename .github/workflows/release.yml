name: Weekly Update and Release

on:
  schedule:
    # 毎週水曜日 UTC 00:00 (日本時間 09:00)
    - cron: '0 0 * * 3'
  workflow_dispatch:

jobs:
  update-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # タグの強制プッシュを行うため履歴を取得
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      # 1. flake.lock を更新
      - name: Update flake.lock
        run: nix flake update

      # 2. 差分があれば自動コミット＆プッシュ
      - name: Commit and push flake.lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: weekly flake.lock update"
          file_pattern: flake.lock

      # 3. インストーラ（img.zst と sha256sum.txt）をビルド
      - name: Build Installer
        run: nix build .#installer

      # 4. 今日の日付を取得
      - name: Set release date
        run: echo "RELEASE_DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      # 5. "latest" タグを現在のコミットに強制付け替え
      - name: Force-update latest tag
        run: |
          git tag -f latest
          git push origin latest --force

      # 6. Releases の "latest" を上書き（古いファイルは削除）
      - name: Update Latest Release
        uses: ncipollo/release-action@v1
        with:
          tag: "latest"
          name: "NEET OS Live Installer (Latest)"
          body: "Automatically built on ${{ env.RELEASE_DATE }}"
          artifacts: "result/neet-live-image.img.zst,result/sha256sum.txt"
          allowUpdates: true
          removeArtifacts: true    # ★ 前回の古い img.zst を消去して容量を節約
          makeLatest: true
          tag_exists_error: false
